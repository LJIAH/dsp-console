# Nginx 反代配置 —— 两种用法
#
# ① 宝塔面板（本项目的实际部署方式）：
#     a) 站点设置里**有**「反向代理」：添加 → 目标 URL http://127.0.0.1:5090、发送域名 $host，
#        再打开该反代的「配置文件」核对三行 Upgrade 头（WebSocket 全靠它们）。
#     b) **没有**（阿里云联合定制版等精简版，站点设置只有 域名管理/流量限制/伪静态/
#        配置文件/重定向/SSL/网站日志）：点站点「配置文件」，把下面 server{} 里的
#        `location / { ... }` 整段贴进去（原来若已有 location / 就替换掉，别并存两个）。
#     面板已经配好证书、listen、server_name，所以**不要**整段复制本文件，只需那段 location。
#
# ② 不用面板时（自己写 nginx.conf，用阿里云免费证书）：
#     sudo cp deploy/nginx.conf /etc/nginx/conf.d/dsp-console.conf
#     sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ 三行不能少，少一个就会「页面能开、连接连不上」：
#     proxy_http_version 1.1
#     proxy_set_header Upgrade $http_upgrade
#     proxy_set_header Connection "upgrade"
#   以及 proxy_read_timeout：默认 60s 会把长连接掐断，
#   然后前端退回退避重连 —— 现场看就是"每隔一分钟闪一下"。

server {
    listen 80;
    server_name <你的域名>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name <你的域名>;

    # 阿里云「数字证书管理服务」下载的 Nginx 版证书
    ssl_certificate     /etc/nginx/cert/<你的域名>.pem;
    ssl_certificate_key /etc/nginx/cert/<你的域名>.key;

    location / {
        proxy_pass http://127.0.0.1:5090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
