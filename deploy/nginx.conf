# Nginx 反代配置 —— 两种用法
#
# ① 宝塔面板（推荐，本项目的实际部署方式）：
#     网站 → dsp.kevy.top → 反向代理 → 添加：目标 URL http://127.0.0.1:5090
#     然后打开该反代的「配置文件」，对照下面核对 / 补齐三行（WebSocket 全靠它们）。
#     面板已经帮你配好证书、listen、server_name，所以**不要**整段复制，只对那三行。
#
# ② 不用面板时（自己写 nginx.conf，用阿里云免费证书）：
#     sudo cp deploy/nginx.conf /etc/nginx/conf.d/dsp-console.conf
#     sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ 三行不能少，少一个就会「页面能开、连接连不上」：
#     proxy_http_version 1.1
#     proxy_set_header Upgrade $http_upgrade
#     proxy_set_header Connection "upgrade"
#   以及 proxy_read_timeout：默认 60s 会把长连接掐断，
#   然后前端退回退避重连 —— 现场看就是"每隔一分钟闪一下"。

server {
    listen 80;
    server_name dsp.kevy.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dsp.kevy.top;

    # 阿里云「数字证书管理服务」下载的 Nginx 版证书
    ssl_certificate     /etc/nginx/cert/dsp.kevy.top.pem;
    ssl_certificate_key /etc/nginx/cert/dsp.kevy.top.key;

    location / {
        proxy_pass http://127.0.0.1:5090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
